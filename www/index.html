:root {
  --bg: #0a0720; --bg2: #1c1050; --card: rgba(255,255,255,.06); --card-strong: rgba(255,255,255,.1);
  --line: rgba(190,170,255,.22); --text: #f4f1ff; --muted: #bdb6e4; --gold: #f2cc6e; --gold-ink: #241a05;
  --violet: #b9a4ff; --teal: #5eead4; --rose: #f0abfc; --ok: #7fd6a8; --warn: #f0b36b; --shadow: 0 12px 34px rgba(8,4,30,.5);
  --grad-title: linear-gradient(90deg, #f6d98a, #f0abfc 60%, #b9a4ff); --glow: 0 0 0 1px rgba(242,204,110,.35), 0 14px 44px rgba(124,58,237,.3);
  --star: rgba(255,255,255,.8);
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f3ff; --bg2: #e3d8ff; --card: rgba(255,255,255,.7); --card-strong: rgba(90,75,196,.1); --teal: #0f766e; --rose: #a21caf; --grad-title: linear-gradient(90deg, #7a4f00, #a21caf 60%, #4c3bb8); --glow: 0 0 0 1px rgba(138,93,10,.35), 0 12px 36px rgba(90,75,196,.2);
    --line: rgba(30,25,70,.16); --text: #231f3d; --muted: #5c5880; --gold: #8a5d0a; --gold-ink: #fff8e6;
    --violet: #5a4bc4; --ok: #1f7a4f; --warn: #9a5a0a; --shadow: 0 10px 30px rgba(30,25,70,.15); --star: rgba(30,25,70,.25);
  }
}
:root[data-theme="light"] {
  --bg: #f7f3ff; --bg2: #e3d8ff; --card: rgba(255,255,255,.7); --card-strong: rgba(90,75,196,.1); --teal: #0f766e; --rose: #a21caf; --grad-title: linear-gradient(90deg, #7a4f00, #a21caf 60%, #4c3bb8); --glow: 0 0 0 1px rgba(138,93,10,.35), 0 12px 36px rgba(90,75,196,.2);
  --line: rgba(30,25,70,.16); --text: #231f3d; --muted: #5c5880; --gold: #8a5d0a; --gold-ink: #fff8e6;
  --violet: #5a4bc4; --ok: #1f7a4f; --warn: #9a5a0a; --shadow: 0 10px 30px rgba(30,25,70,.15); --star: rgba(30,25,70,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans); min-height: 100vh; overflow-x: hidden;
  background-image: radial-gradient(900px 520px at 12% -6%, color-mix(in srgb, #7c3aed 38%, transparent), transparent 62%), radial-gradient(800px 480px at 105% 8%, color-mix(in srgb, #2dd4bf 16%, transparent), transparent 60%), radial-gradient(700px 600px at 50% 112%, color-mix(in srgb, #ec4899 16%, transparent), transparent 62%), radial-gradient(1200px 600px at 50% -10%, var(--bg2), transparent 70%);
  background-attachment: fixed;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .55;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, var(--star), transparent 60%), radial-gradient(1px 1px at 28% 62%, var(--star), transparent 60%),
    radial-gradient(1.4px 1.4px at 44% 12%, var(--star), transparent 60%), radial-gradient(1px 1px at 63% 38%, var(--star), transparent 60%),
    radial-gradient(1.3px 1.3px at 78% 72%, var(--star), transparent 60%), radial-gradient(1px 1px at 90% 20%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 8% 86%, var(--star), transparent 60%), radial-gradient(1.2px 1.2px at 52% 90%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 95% 55%, var(--star), transparent 60%), radial-gradient(1.1px 1.1px at 35% 40%, var(--star), transparent 60%);
}
#app { position: relative; max-width: 480px; margin: 0 auto; padding: 0 16px 104px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 0 8px; }
.brand { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: .02em; color: var(--gold); }
.brand small { font: 500 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; line-height: 1.15; }
h1 { font-size: 34px; } h2 { font-size: 30px; margin-bottom: 4px; background: var(--grad-title); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; } h3 { font-size: 20px; margin-bottom: 6px; color: var(--gold); }
p { margin: 0 0 10px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
.card { background: linear-gradient(150deg, color-mix(in srgb, var(--card) 100%, transparent), color-mix(in srgb, var(--card) 45%, transparent)); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin: 14px 0; backdrop-filter: blur(10px); box-shadow: var(--shadow); }
.card.glow { border-color: color-mix(in srgb, var(--gold) 55%, transparent); box-shadow: var(--glow); }
.row { display: flex; gap: 12px; align-items: center; } .row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.big-symbol { font-size: 54px; line-height: 1; color: var(--gold); font-family: "Segoe UI Symbol", "Noto Sans Symbols", serif; }
.tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; } .tthumb { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; text-align: center; color: var(--text); font: inherit; cursor: pointer; } .tthumb:hover { border-color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--card); }
.chip.gold { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
button, .btn { font: 600 15px var(--sans); border-radius: 14px; border: 1px solid var(--line); background: var(--card-strong); color: var(--text); padding: 12px 16px; cursor: pointer; min-height: 44px; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.primary { background: linear-gradient(135deg, #f8dc86, #e3a93d); color: #241a05; border-color: transparent; box-shadow: 0 8px 22px rgba(240,190,80,.28); }
button.ghost { background: transparent; }
button.danger { color: var(--warn); }
button.block { width: 100%; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input, select, textarea { width: 100%; font: 16px var(--sans); color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 44px; }
textarea { min-height: 76px; resize: vertical; }
input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; accent-color: var(--gold); }
.check { display: flex; gap: 10px; align-items: center; margin-top: 10px; color: var(--text); font-size: 14px; }
.check label { margin: 0; color: var(--text); font-size: 14px; }

  ["WOOP (Wunsch, Ergebnis, Hindernis, Plan)", "Wunsch: Was ist dir wichtig und machbar? Ergebnis: Wie fühlt sich das Beste daran an? Hindernis: Was in dir steht dir am ehesten im Weg? Plan: „Wenn das Hindernis kommt, dann tue ich …“.", "Gut belegt", "Entwickelt von Gabriele Oettingen und Peter Gollwitzer. Studien zu Gesundheit, Schule, Beruf und Beziehungen zeigen Vorteile gegenüber reinem Wunschdenken. Es wirkt nur, wenn der Wunsch dir wirklich wichtig ist."],

function manWissen() {
  var h = '<section class="card glow"><h3>Was ist Manifestation?</h3><p>Manifestieren heißt: Du richtest Gedanken, Gefühle und Absichten auf einen Wunsch aus, in der Erwartung, dass er sich erfüllt. Die bekannteste Form ist das „Gesetz der Anziehung“ („Gleiches zieht Gleiches an“).</p><p class="small muted" style="margin:0">Dieses Gesetz selbst ist wissenschaftlich nicht belegt. Einzelne Bausteine, die oft damit verbunden werden, haben aber Forschung hinter sich. Die Seite trennt beides.</p></section>';
  h += '<section class="card"><h3>Der Weg, der in Studien trägt</h3><ol class="steps"><li><strong>Wunsch klären:</strong> konkret, wichtig und machbar.</li><li><strong>Bestes Ergebnis fühlen:</strong> kurz und lebendig vorstellen, damit der Wunsch Kraft bekommt.</li><li><strong>Hindernis benennen:</strong> was in dir steht dem am ehesten im Weg?</li><li><strong>Wenn-Dann-Plan:</strong> „Wenn das Hindernis kommt, dann tue ich …“. Dann handeln und nach einer Woche prüfen.</li></ol><p class="small muted">Das ist die WOOP-Methode nach Gabriele Oettingen und Peter Gollwitzer. Ist das Hindernis in deinen Augen unüberwindbar, hilft laut Forschung eher, den Wunsch anzupassen oder kleiner zu fassen, statt sich zu überfordern.</p></section>';

    '<tr><td>Wunschbild plus Hindernis plus Wenn-Dann-Plan verbesserte Ergebnisse in Gesundheit, Schule, Beruf und Beziehungen.</td><td class="small">Oettingen und Gollwitzer 2019</td></tr>' +
    '<tr><td>Wenn-Dann-Pläne: mittlere bis große Wirkung auf die Zielerreichung (d = 0,65).</td><td class="small">Gollwitzer und Sheeran 2006, zitiert bei Oettingen und Gollwitzer 2019</td></tr>' +

  h += '<section class="card"><h3>Gehirn und Gefühl: Warum der Zustand zählt</h3><p class="small">Dein innerer Zustand beeinflusst, was du siehst und tust. Unter Stress wird der Blick eng, und du greifst zu alten Mustern. In Ruhe fallen dir mehr Möglichkeiten ein, und du handelst überlegter. Darum beginnt gutes Manifestieren mit Beruhigung, nicht mit Druck. Mehr dazu, auch zu Gehirnwellen und wie Menschen ticken, findest du im Mentor.</p></section>';

function viewDatenschutz() {

  h += legalH("9. Deine Rechte") + '<p class="small" style="margin:0">Du hast nach der DSGVO die Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch. Weil alle Daten bei dir liegen, übst du sie direkt in der App aus. Bei Fragen schreib an die E-Mail-Adresse oben. Du kannst dich außerdem bei einer Aufsichtsbehörde beschweren, in Österreich bei der Datenschutzbehörde (Barichgasse 40–42, 1030 Wien, dsb.gv.at) oder bei der Behörde deines Wohnsitzlandes.</p>';

function mnGehirn() {
  var h = '<section class="card glow"><h3>Drei Ebenen: Denken, Fühlen, Handeln</h3><p>Dein Gehirn arbeitet nicht als Einheit, sondern in Schichten, die zusammenspielen. <strong>Denken</strong> (Großhirnrinde, vor allem der Stirnbereich): Wissen, Planen, sich selbst beobachten. <strong>Fühlen</strong> (limbisches System, Mandelkern): Gefühle und Stressreaktion, schneller als Nachdenken. <strong>Handeln aus Gewohnheit</strong> (Basalganglien und Kleinhirn): eingeübte Abläufe, die ohne Nachdenken laufen. Etwas Neues lernst du zuerst mit dem Kopf, dann durch Tun, und am Ende läuft es von allein.</p></section>';
  h += '<section class="card"><h3>Was zusammen feuert, verbindet sich</h3><p>Nervenzellen, die oft gemeinsam aktiv sind, stärken ihre Verbindung (Hebb 1949, vereinfacht). Wer täglich dieselben Gedanken denkt, dieselben Gefühle fühlt und dasselbe tut, baut dafür eine breite Straße. Neue Wege sind am Anfang ein Trampelpfad und brauchen Wiederholung. Das Gehirn bleibt ein Leben lang lernfähig.</p></section>';

    '<tr><td>Theta</td><td>4 bis 8 Hz</td><td class="small">Einschlafen, Tagträumen, tiefe Entspannung, bei Meditation oft vorn im Kopf</td></tr>' +
    '<tr><td>Alpha</td><td>8 bis 12 Hz</td><td class="small">Entspannt wach, besonders bei geschlossenen Augen</td></tr>' +

    '<tr><td>Gamma</td><td>über 30 Hz</td><td class="small">Aufmerksamkeit und das Verbinden von Eindrücken</td></tr></table>' +

      t2 += a ? vsRow(esc(me) + ' ' + n + (a.exact ? "" : " ~"), houseOf(a.lon, E2.ang.asc) + '. Haus', '<span class="small muted">' + HOUSE_THEMES[houseOf(a.lon, E2.ang.asc) - 1] + '</span>') : "";
    });
    h += '<section class="card"><h3>Häuser über Kreuz</h3><p class="small muted">Wo fällt die Energie des anderen in dein Geburtsbild, und umgekehrt? Gleich große Häuser (Äqual-System).</p><h4 style="margin:10px 0 4px">In ' + esc(me) + 's Häusern</h4><div class="vs">' + t1 + '</div><h4 style="margin:14px 0 4px">In ' + esc(you) + 's Häusern</h4><div class="vs">' + t2 + '</div></section>';
    h += '<section class="card"><h3>Aszendent, Deszendent, MC</h3><div class="vs head names"><div class="c">' + esc(me) + '</div><div class="c c2">' + esc(you) + '</div></div><div class="vs">' + vsRow("Aszendent", fmtLon(D.ang.asc), fmtLon(E2.ang.asc)) + vsRow("Deszendent", fmtLon(D.ang.dsc), fmtLon(E2.ang.dsc)) + vsRow("MC", fmtLon(D.ang.mc), fmtLon(E2.ang.mc)) + '</div>' +
      '<p class="small" style="margin-top:8px">' + (angDiff(D.ang.asc, E2.ang.dsc) <= 8 ? 'Dein Aszendent liegt nahe am Deszendenten von ' + esc(you) + ': nach der Tradition ein klassisches Partnerschaftszeichen. ' : '') + (angDiff(E2.ang.asc, D.ang.dsc) <= 8 ? esc(you) + 's Aszendent liegt nahe an deinem Deszendenten: nach der Tradition ein klassisches Partnerschaftszeichen. ' : '') + '</p></section>';
    h += '<section class="card"><h3>Geburtsbilder</h3><div class="vs head names"><div class="c">' + esc(me) + '</div><div class="c c2">' + esc(you) + '</div></div><div class="vs"><div class="c">' + chartSVG(D) + '</div><div class="c c2">' + chartSVG(E2) + '</div></div></section>';
  }
  var zA = D.zr, zB = E2.zr, both = zA.present.filter(function (x) { return zB.present.indexOf(x) >= 0; }), onlyA = zA.present.filter(function (x) { return zB.present.indexOf(x) < 0; }), onlyB = zB.present.filter(function (x) { return zA.present.indexOf(x) < 0; });
  var union = {}; zA.present.concat(zB.present).forEach(function (x) { union[x] = 1; });
  var dirs = ["Norden", "Osten", "Süden", "Westen", "Mitte"].filter(function (k) { return zA.counts[k] + zB.counts[k] > 0; });
  h += '<section class="card"><h3>Zahlenrad</h3><div class="vs head names"><div class="c">' + esc(me) + '</div><div class="c c2">' + esc(you) + '</div></div><div class="vs"><div class="c">' + wheelSVG(zA) + '<div class="small">' + zA.digits.join(" · ") + '</div></div><div class="c c2">' + wheelSVG(zB) + '<div class="small">' + zB.digits.join(" · ") + '</div></div></div>' +
    '<p style="margin-top:10px"><strong>Gemeinsam:</strong> ' + (both.length ? both.join(", ") : "keine Ziffer") + '<br><strong>Nur ' + esc(me) + ':</strong> ' + (onlyA.length ? onlyA.join(", ") : "–") + '<br><strong>Nur ' + esc(you) + ':</strong> ' + (onlyB.length ? onlyB.join(", ") : "–") + '</p>' +
    '<p class="small">Zusammen deckt ihr ' + Object.keys(union).length + ' von 10 Ziffern und ' + dirs.length + ' von 5 Stationen des Rades ab. Nach der Tradition kann, was dir fehlt, bei anderen vorhanden sein und dir Impulse geben. Überlieferung, keine Messung.</p></section>';
  var gA = D.gc.code, gB = E2.gc.code, same = 0, shared = []; for (var k = 0; k < 5; k++) { if (gA[k] === gB[k]) same++; if (gB.indexOf(gA[k]) >= 0 && shared.indexOf(gA[k]) < 0) shared.push(gA[k]); }
  h += '<section class="card"><h3>Geldcode</h3><div class="vs head names"><div class="c">' + esc(me) + '</div><div class="c c2">' + esc(you) + '</div></div><div class="vs"><div class="c">' + pentaSVG(D.gc) + '</div><div class="c c2">' + pentaSVG(E2.gc) + '</div></div>' +
    '<p style="margin-top:10px">An ' + same + ' von 5 Stellen steht dieselbe Zahl' + (shared.length ? ', gemeinsame Zahlen insgesamt: ' + shared.sort().join(", ") : ', gemeinsame Zahlen gibt es keine') + '.</p><p class="small muted">Eine Deutung der Zacken gibt es bewusst nicht.</p></section>';
  h += '<div class="note small">Das ist ein Vergleich nach Überlieferung, keine Messung der Verträglichkeit. Wissenschaftlich nicht belegt, es entscheidet nicht über eure Beziehung.</div>';
  return h;
}
function GLYPH_SAFE(n) { return GLYPH[n] || ""; }

function viewHoroskop(D) {

  var h = '<h2>Horoskop</h2><p class="muted">Liebe, Beruf, Leben und dein Geburtsbild</p><div class="seg">' + seg.map(function (s) { return '<button data-act="sub" data-sub="' + s[0] + '" aria-pressed="' + (S.sub === s[0]) + '">' + s[1] + '</button>'; }).join("") + '</div>';
  return h + (S.sub === "bild" ? viewGeburtsbild(D) : S.sub === "zeichen" ? viewZeichen(D) : viewFuerDich(D));
}

var TABS = [["heute", "☉", "Heute"], ["horoskop", "☊", "Horoskop"], ["mond", "☽", "Mond"], ["partner", "♡", "Partner"], ["zahlen", "✦", "Erweiterung"], ["mehr", "⋯", "Mehr"]];
function render() {
  var app = document.getElementById("app"), h = "";
  if (!S.profile || S.editing) { app.innerHTML = viewForm() + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + "</div>" : ""); bindForm(); return; }
  var D; try { D = derive(S.profile); } catch (e) { app.innerHTML = '<div class="card">Die Daten im Profil lassen sich nicht berechnen. <button data-act="edit">Profil prüfen</button></div>'; return; }
  h += '<header class="top" style="display:flex;justify-content:space-between;align-items:center"><div class="brand">Sternenpfad<small>' + T("ui.proto") + '</small></div><button class="ghost" data-act="tab" data-tab="frag" style="padding:6px 12px;min-height:40px" aria-label="' + esc(T("ui.ask")) + '">✦ ' + T("ui.ask") + '</button></header>';
  h += S.tab === "heute" ? viewHeute(D) : S.tab === "horoskop" ? viewHoroskop(D) : S.tab === "zahlen" ? viewErweiterung(D) : S.tab === "mond" ? viewMond(D) : S.tab === "partner" ? viewPartner(D) : S.tab === "frag" ? viewFrag(D) : S.tab === "tarot" ? viewTarot(D) : viewMehr();
  h += '<p class="small muted center" style="margin-top:22px">' + T("ui.foot") + '</p>';
  h += '<nav class="tabs" aria-label="Hauptmenü"><div class="in">' + TABS.map(function (t) { return '<button data-act="tab" data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : "") + '><span class="ic" aria-hidden="true">' + t[1] + "</span>" + T("nav." + t[0]) + "</button>"; }).join("") + "</div></nav>";
  if (S.sheet) h += viewDonate();

  app.innerHTML = h; if (typeof afterRender === "function") afterRender();
  if ((S.tab === "horoskop" || S.tab === "zahlen") && !donateShown && !S.noDonate) { donateShown = true; setTimeout(function () { S.sheet = true; render(); }, 2600); }
}
function toast(t) { S.toast = t; render(); setTimeout(function () { if (S.toast === t) { S.toast = ""; render(); } }, 4200); }

/* ---------- Formular ---------- */
function num(v) { return String(v).replace(",", "."); }
function bindForm() {
  var f = document.getElementById("pform"); if (!f) return;
  var city = document.getElementById("f-city"), lat = document.getElementById("f-lat"), lon = document.getElementById("f-lon"), date = document.getElementById("f-date"), time = document.getElementById("f-time"), dst = document.getElementById("f-dst"), utc = document.getElementById("f-utc");
  function suggest() {
    if (!date.value) return; var d = date.value.split("-").map(Number), t = time.value ? time.value.split(":").map(Number) : [12, 0], ci = city.value, c = (ci !== "" && ci !== "x") ? CITIES[ci] : null;
    var zn = c ? c[3] : (lat.dataset.zone || ""), zl = c ? c[2] : Number(num(lon.value)); if (zn && isFinite(zl)) { var r = tzSuggestLocal(zn, d[0], d[1], d[2], t[0], t[1], zl); if (r) { utc.value = String(r.utc).replace(".", ","); dst.checked = r.dst; return; } }
    var s = dstSuggest(d[0], d[1], d[2], t[0], t[1]); if (s !== null && Number(num(utc.value)) === 1) dst.checked = s;
  }
  date.addEventListener("change", suggest); time.addEventListener("change", suggest); utc.addEventListener("change", suggest);
  city.addEventListener("change", function () { lat.dataset.zone = ""; var i = city.value; if (i !== "" && i !== "x") { lat.value = String(CITIES[i][1]).replace(".", ","); lon.value = String(CITIES[i][2]).replace(".", ","); utc.value = "1"; suggest(); } });
  f.addEventListener("submit", function (e) {
    e.preventDefault(); var err = document.getElementById("ferr"), msgs = [];
    var dv = date.value, la = lat.value.trim() === "" ? null : Number(num(lat.value)), lo = lon.value.trim() === "" ? null : Number(num(lon.value)), uo = Number(num(utc.value));
    if (!dv) msgs.push("Bitte gib dein Geburtsdatum ein.");
    else { var yy = Number(dv.slice(0, 4)); if (yy < 1583) msgs.push("Die Rechnung gilt ab dem gregorianischen Kalender (1583)."); if (new Date(dv) > new Date()) msgs.push("Das Geburtsdatum liegt in der Zukunft."); }
    if ((la === null) !== (lo === null)) msgs.push("Bitte gib Breite und Länge zusammen an, oder wähle einen Ort.");
    if (la !== null && (isNaN(la) || la < -90 || la > 90)) msgs.push("Die Breite muss zwischen −90 und 90 liegen.");
    if (lo !== null && (isNaN(lo) || lo < -180 || lo > 180)) msgs.push("Die Länge muss zwischen −180 und 180 liegen.");
    if (isNaN(uo) || uo < -12 || uo > 14) msgs.push("Der UTC-Versatz muss zwischen −12 und 14 liegen.");
    if (time.value && (la === null || lo === null)) msgs.push("Mit Geburtszeit brauche ich auch den Geburtsort für Aszendent und Häuser. Lass die Zeit leer, wenn du den Ort nicht kennst.");
    if (msgs.length) { err.innerHTML = msgs.map(esc).join("<br>"); err.classList.remove("hidden"); return; }
    saveProfile({ name: document.getElementById("f-name").value.trim(), date: dv, time: time.value || "", cityIdx: city.value, lat: la, lon: lo, utc: uo, dst: dst.checked });
    S.editing = false; S.tab = "heute"; render(); window.scrollTo(0, 0);
  });
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]"); if (!t) return; var a = t.getAttribute("data-act");
  if (a === "donate-bg" && e.target !== t) return;

  else if (a === "ext-open") { S.ext = t.getAttribute("data-e"); render(); window.scrollTo(0, 0); }

  else if (a === "aura-reset") { S.auraAns = {}; lsDel("sp_aura"); render(); }
  else if (a === "edit") { S.editing = true; render(); window.scrollTo(0, 0); }
  else if (a === "cancel-edit") { S.editing = false; render(); }
  else if (a === "del-profile") { if (!S.delAsk) { S.delAsk = true; render(); setTimeout(function () { if (S.delAsk) { S.delAsk = false; render(); } }, 8000); return; } S.delAsk = false; { ["sp_profile", "sp_goals", "sp_nodonate", "sp_partner", "sp_draws", "sp_aura", "sp_zy", "sp_dreams", "sp_diary", "sp_people", "sp_nz", "sp_wishes", "sp_grat", "sp_mentor", "sp_streak", "sp_ritual", "sp_settings", "sp_notif_day"].forEach(lsDel); S.partner = null; S.profile = null; S.editing = false; DREAMS = []; MENTOR = []; RITUAL = []; STREAK = { last: "", n: 0, best: 0 }; DIARY = []; PEOPLE = []; WISHES = []; GRAT = []; SETTINGS = { lang: "auto", theme: "auto", push: false, daily: true, moon: true, time: "08:00" }; applyLangTheme(); X.nzName = ""; X.pend = null; S.noDonate = false; donateShown = false; render(); } }
  else if (a === "tarot") { var dk = new Date().toISOString().slice(0, 10) + (S.profile ? S.profile.date : ""), hsh = 0; for (var i = 0; i < dk.length; i++) hsh = (hsh * 31 + dk.charCodeAt(i)) >>> 0; S.tarot = TAROT[hsh % TAROT.length]; render(); }
  else if (a === "goal-save") { var w1 = document.getElementById("w1").value.trim(); if (!w1) { toast("Bitte schreib zuerst deinen Wunsch auf."); return; } var g = goals(); g.unshift({ w1: w1, w2: document.getElementById("w2").value.trim(), w3: document.getElementById("w3").value.trim(), w4: document.getElementById("w4").value.trim() }); lsSet("sp_goals", JSON.stringify(g)); render(); toast("Gespeichert, nur auf diesem Gerät."); }
  else if (a === "goal-del") { var g2 = goals(); g2.splice(Number(t.getAttribute("data-i")), 1); lsSet("sp_goals", JSON.stringify(g2)); render(); }
  else if (a === "sub") { S.sub = t.getAttribute("data-sub"); render(); window.scrollTo(0, 0); }
  else if (a === "other-calc") { S.otherDate = document.getElementById("o-date").value; render(); }
  else if (a === "partner-go") {
    var gv = function (id) { return document.getElementById(id); }, pd = gv("p-date").value, msgs = [], err = gv("perr");
    var la = gv("p-lat").value.trim() === "" ? null : Number(num(gv("p-lat").value)), lo = gv("p-lon").value.trim() === "" ? null : Number(num(gv("p-lon").value)), uo = Number(num(gv("p-utc").value)), tm2 = gv("p-time").value;
    if (!parseDate(pd)) msgs.push("Bitte gib ein gültiges Geburtsdatum ein."); else if (new Date(pd) > new Date()) msgs.push("Das Geburtsdatum liegt in der Zukunft.");
    if ((la === null) !== (lo === null)) msgs.push("Bitte gib Breite und Länge zusammen an, oder wähle einen Ort.");
    if (la !== null && (isNaN(la) || la < -90 || la > 90)) msgs.push("Die Breite muss zwischen −90 und 90 liegen.");
    if (lo !== null && (isNaN(lo) || lo < -180 || lo > 180)) msgs.push("Die Länge muss zwischen −180 und 180 liegen.");
    if (isNaN(uo) || uo < -12 || uo > 14) msgs.push("Der UTC-Versatz muss zwischen −12 und 14 liegen.");
    if (tm2 && (la === null || lo === null)) msgs.push("Mit Geburtszeit brauche ich auch den Geburtsort. Lass die Zeit leer, wenn du den Ort nicht kennst.");
    if (msgs.length) { err.innerHTML = msgs.map(esc).join("<br>"); err.classList.remove("hidden"); return; }
    S.partner = { name: gv("p-name").value.trim(), date: pd, time: tm2 || "", cityIdx: gv("p-city").value, lat: la, lon: lo, utc: uo, dst: gv("p-dst").checked }; lsSet("sp_partner", JSON.stringify(S.partner)); render();
  }
  else if (a === "partner-del") { S.partner = null; lsDel("sp_partner"); render(); }
  else if (a === "tt-sub") { TT.sub = t.getAttribute("data-sub"); TT.card = null; render(); window.scrollTo(0, 0); }
  else if (a === "tt-grp") { TT.grp = Number(t.getAttribute("data-k")); TT.card = null; render(); }
  else if (a === "tt-open") { TT.card = Number(t.getAttribute("data-id")); render(); window.scrollTo(0, 0); }
  else if (a === "tt-close") { TT.card = null; render(); }
  else if (a === "tt-view") { TT.view = Number(t.getAttribute("data-k")); render(); }
  else if (a === "tt-draw") { ttDraw(); }
  else if (a === "ask-send") { var ai = document.getElementById("ask-in"); askSend(ai ? ai.value : ""); }
  else if (a === "ask-chip") { askSend(t.getAttribute("data-q")); }
  else if (a === "ask-clear") { S.chat = []; render(); }
  else if (a === "ai-toggle") { S.useAI = t.checked; render(); }
  else if (a === "open-donate") { S.sheet = true; render(); }
  else if (a === "donate-later" || a === "donate-bg") { S.sheet = false; render(); }
  else if (a === "donate-never") { S.sheet = false; S.noDonate = true; lsSet("sp_nodonate", "1"); render(); toast("Alles klar, ich frage nicht mehr. Unter „Mehr“ findest du den Hinweis weiterhin."); }
  else if (a === "donate") { S.sheet = false; render(); donateGo(t.getAttribute("data-amt")); }
});
document.addEventListener("change", function (e) {
  var id = e.target && e.target.id; if (!id || id.indexOf("p-") !== 0) return;
  var g = function (x) { return document.getElementById(x); };
  function sug() {
    var dv = g("p-date").value; if (!dv) return; var d = dv.split("-").map(Number), tv = g("p-time").value, tt = tv ? tv.split(":").map(Number) : [12, 0], ci = g("p-city").value, c = (ci !== "" && ci !== "x") ? CITIES[ci] : null;

    var s = dstSuggest(d[0], d[1], d[2], tt[0], tt[1]); if (s !== null && Number(num(g("p-utc").value)) === 1) g("p-dst").checked = s;
  }
  if (id === "p-city") { g("p-lat").dataset.zone = ""; var v = e.target.value; if (v !== "" && v !== "x") { g("p-lat").value = String(CITIES[v][1]).replace(".", ","); g("p-lon").value = String(CITIES[v][2]).replace(".", ","); g("p-utc").value = "1"; sug(); } }
  else if (id === "p-date" || id === "p-time" || id === "p-utc") sug();
});
document.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && e.target && e.target.id === "ask-in") { e.preventDefault(); askSend(e.target.value); return; } if (e.key === "Escape" && S.sheet) { S.sheet = false; render(); } });

initEngine();
render();
})();
