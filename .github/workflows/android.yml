name: Android-APK bauen

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt anlegen
        run: npx cap add android

      - name: Symbole und Startbild erzeugen
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Benachrichtigungs-Symbol einbauen
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_sternenpfad.png android/app/src/main/res/drawable/ic_stat_sternenpfad.png

      - name: Berechtigungen und Datenschutz-Einstellungen anpassen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # Internet-Recht bleibt (Capacitor setzt es): nur für die freiwillige Ortssuche (OpenStreetMap), per CSP auf diesen Host begrenzt
          grep -q android.permission.INTERNET "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>#' "$M"
          # Keine automatische Cloud-Sicherung der App-Daten durch Android
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          # Mitteilungen ab Android 13
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$M"
          # Versionsnummer pro Build hochzählen
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          cat "$M"

      - name: Web-Dateien in die App kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleRelease

      - name: APK signieren
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein eigener Schlüssel hinterlegt. Es wird ein Test-Schlüssel erzeugt. Für die echte Veröffentlichung unbedingt deinen eigenen Schlüssel eintragen (siehe ANLEITUNG.md), sonst sind spätere Updates nicht möglich."
            keytool -genkeypair -v -keystore test.jks -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testtest -keypass testtest -dname "CN=Sternenpfad Test"
            KS=test.jks; KP=testtest; KA=test; KKP=testtest
          else
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            KS=release.jks; KP="$KEYSTORE_PASSWORD"; KA="$KEY_ALIAS"; KKP="$KEY_PASSWORD"
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --min-sdk-version 22 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --ks "$KS" --ks-pass "pass:$KP" --key-pass "pass:$KKP" --ks-key-alias "$KA" --out Sternenpfad.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs Sternenpfad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sternenpfad-APK
          path: Sternenpfad.apk

      - name: Download-Link (Release) veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Sternenpfad.apk --title "Sternenpfad $TAG" --notes "Sternenpfad Android-App. Datei Sternenpfad.apk herunterladen und öffnen." --latest
