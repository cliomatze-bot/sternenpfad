name: APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: Release-APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APKs prüfen (Signatur, Mindest-Android-Version)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            [ -f "$APK" ] || continue
            echo "== $APK"; ls -lh "$APK"
            "$BT/apksigner" verify --min-sdk-version 21 --verbose "$APK" | grep -E "Verified|v1|v2|v3"
            "$BT/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion"
          done

      - name: APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: InstagramProfileAnalyzer-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Eine einzige APK als Download veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/InstagramProfileAnalyzer.apk
          # ältere APK-Releases entfernen, damit es nur eine App zum Download gibt
          for t in $(gh release list --limit 50 --json tagName -q '.[].tagName' | grep '^apk-' || true); do
            gh release delete "$t" --cleanup-tag -y || true
          done
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/InstagramProfileAnalyzer.apk --target "$GITHUB_SHA" --latest=false \
            --title "Instagram Profile Analyzer (Build ${GITHUB_RUN_NUMBER})" \
            --notes "Installierbare APK, ab Android 5.0."

      - name: APK zusätzlich in Branch apk-dist ablegen
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          git init -q -b apk-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add InstagramProfileAnalyzer.apk
          git commit -q -m "APK aus Build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" apk-dist
