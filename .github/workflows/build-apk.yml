name: APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: APK prüfen
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"

      - name: Release-APK bauen (mit Debug-Schlüssel signiert)
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: InstagramProfileAnalyzer-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Release mit APK veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/InstagramProfileAnalyzer-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/InstagramProfileAnalyzer-release.apk
          fi
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" \
            --title "Instagram Profile Analyzer (Build ${GITHUB_RUN_NUMBER})" \
            --notes "Automatisch gebaute, installierbare APK (debug-signiert)."

      - name: APK zusätzlich in Branch apk-dist ablegen
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          git init -q -b apk-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.apk
          git commit -q -m "APK aus Build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" apk-dist
